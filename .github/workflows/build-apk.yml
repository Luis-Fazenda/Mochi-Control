name: Build Mochi Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Mochi_Control_AndroidAuto/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Mochi Control debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mochi_Control_AndroidAuto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-Control-debug-apk
          path: Mochi_Control_AndroidAuto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
